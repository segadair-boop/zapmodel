services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 8080
      FRONTEND_URL: ${FRONTEND_URL:-https://zapmodel.lovable.app}
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-replace-this-secret-before-production}
      OWNER_NAME: ${OWNER_NAME:-Administrador}
      OWNER_EMAIL: ${OWNER_EMAIL:-admin@example.com}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-CHANGE_ME_NOW}
      WA_AUTH_DIR: /app/data/wa-auth
      UPLOAD_DIR: /app/data/uploads
    ports:
      - "8080:8080"
    volumes:
      - backend_data:/app/data

volumes:
  redis_data:
  backend_data:
